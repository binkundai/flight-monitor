name: Flight Price Monitor

on:
  schedule:
    # GitHub 使用 UTC 时间（北京时间 = UTC + 8）
    # 下面代表每天 北京时间 08:17、14:17、20:17 各跑一次（错开整点可减少排队延迟）
    - cron: '17 0,6,12 * * *'
  workflow_dispatch: # 允许在网页端手动点按钮测试

permissions:
  contents: write # 允许脚本把最新的 history.json 写回仓库

jobs:
  check-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py

      - name: Commit history if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update flight price history" && git push)
