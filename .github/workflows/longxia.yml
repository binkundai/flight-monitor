name: Longxia Realtime Flight Radar

on:
  schedule:
    # UTC 22:15 = 北京时间次日 06:15 (早班全量)
    # UTC 10:15 = 北京时间当日 18:15 (晚班临期)
    - cron: '15 10,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '扫描模式 (auto=按时间自动, morning=强制早班全量, evening=强制晚班临期)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

concurrency:
  group: longxia-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-longxia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Longxia realtime radar
        env:
          LONGXIA_TOKEN: ${{ secrets.LONGXIA_TOKEN }}
          LONGXIA_TOKEN_2: ${{ secrets.LONGXIA_TOKEN_2 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SCAN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python longxia_radar.py

      - name: Commit data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json history_longxia.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Longxia realtime flight data"
            git pull --rebase -X theirs origin main
            git push
          fi
