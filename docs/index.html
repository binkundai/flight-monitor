<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上海双向特价机票雷达看板</title>
  <style>
    :root {
      --bg: #f5f7fb; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --primary: #2563eb; --danger: #dc2626; --success: #059669; --purple: #7c3aed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 1220px; margin: 0 auto; padding: 20px 16px 60px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; }
    .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .dir-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .dir-btn {
      flex: 1; min-width: 160px; padding: 12px 16px; border-radius: 10px; border: 2px solid var(--border);
      background: var(--card); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; text-align: center;
    }
    .dir-btn.active[data-dir="outbound"] { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .dir-btn.active[data-dir="inbound"] { border-color: var(--purple); background: #f5f3ff; color: var(--purple); }
    .dir-btn.active[data-dir="both"] { border-color: #0f766e; background: #f0fdfa; color: #0f766e; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 700; }

    .tabs-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .view-switch { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
    .view-btn { border: none; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
    .view-btn.active { background: var(--text); color: #fff; }

    .filters { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; }
    .check-row { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; font-size: 14px; cursor: pointer; }
    .check-row input { width: auto; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; gap: 8px; }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f8fafc; font-size: 12px; color: var(--muted); font-weight: 600; }
    tr:hover td { background: #f8fafc; }

    .price { font-size: 16px; font-weight: 700; color: var(--danger); }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-left: 4px; }
    .b-radar { background: #fee2e2; color: #b91c1c; }
    .b-pop { background: #dbeafe; color: #1d4ed8; }
    .b-ow { background: #f1f5f9; color: #475569; }
    .b-rt { background: #ecfdf5; color: #047857; }
    .b-out { background: #eff6ff; color: #1d4ed8; margin-left: 0; margin-right: 6px; }
    .b-in { background: #f5f3ff; color: #6d28d9; margin-left: 0; margin-right: 6px; }
    .btn-link { display: inline-block; padding: 5px 10px; background: var(--primary); color: #fff; text-decoration: none; border-radius: 6px; font-size: 12px; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }

    /* 日历视图样式 */
    .cal-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .cal-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-city-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cal-city-pick select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-weight: 600; }
    .month-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .m-pill { border: 1px solid var(--border); background: #f8fafc; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .m-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .m-pill small { opacity: 0.85; margin-left: 4px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-head { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 0; }
    .cal-cell {
      min-height: 78px; border: 1px solid var(--border); border-radius: 8px; padding: 6px;
      display: flex; flex-direction: column; justify-content: space-between; background: #fff; text-decoration: none; color: inherit;
    }
    .cal-cell.empty-cell { background: #f8fafc; border-style: dashed; opacity: 0.5; }
    .cal-cell.has-deal { cursor: pointer; transition: transform 0.1s ease, border-color 0.1s ease; }
    .cal-cell.has-deal:hover { border-color: var(--primary); transform: translateY(-1px); }
    .cal-cell.is-cheap { background: #f0fdf4; border-color: #86efac; }
    .cal-cell.is-anomaly { background: #fef2f2; border-color: #fca5a5; }
    .cal-day { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    .cal-day .wknd { color: var(--primary); font-weight: 600; }
    .cal-price { font-size: 15px; font-weight: 700; color: var(--text); margin: 4px 0 2px; }
    .cal-cell.is-cheap .cal-price { color: var(--success); }
    .cal-cell.is-anomaly .cal-price { color: var(--danger); }
    .cal-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 640px) {
      .cal-cell { min-height: 64px; padding: 4px; }
      .cal-price { font-size: 13px; }
      .cal-sub { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>✈️ 上海双向特价机票雷达看板</h1>
        <div class="meta" id="updatedAt">正在加载最新数据...</div>
      </div>
      <button class="tab-btn" onclick="resetFilters()">重置筛选</button>
    </header>

    <div class="dir-bar">
      <button class="dir-btn active" data-dir="outbound" onclick="setDir('outbound', this)">🛫 上海出发（SHA → 各地）</button>
      <button class="dir-btn" data-dir="inbound" onclick="setDir('inbound', this)">🛬 飞往上海（各地 → SHA）</button>
      <button class="dir-btn" data-dir="both" onclick="setDir('both', this)">🔄 双向对照（去程 + 回程）</button>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="stat-label">当前方向报价数</div><div class="stat-value" id="statTotal">-</div></div>
      <div class="stat-card"><div class="stat-label">🔥 异常低价数</div><div class="stat-value" id="statAnomalies" style="color:var(--danger)">-</div></div>
      <div class="stat-card"><div class="stat-label">最低单程价</div><div class="stat-value" id="statMinOW" style="color:var(--success)">-</div></div>
      <div class="stat-card"><div class="stat-label">最低 3-7 天往返</div><div class="stat-value" id="statMinRT">-</div></div>
    </div>

    <div class="tabs-row">
      <div class="tabs">
        <button class="tab-btn active" data-tab="all" onclick="setTab('all', this)">📋 全部报价</button>
        <button class="tab-btn" data-tab="radar" onclick="setTab('radar', this)">🔥 异常低价雷达</button>
        <button class="tab-btn" data-tab="popular" onclick="setTab('popular', this)">🏆 热门航线性价比榜</button>
      </div>
      <div class="view-switch">
        <button class="view-btn active" data-view="table" onclick="setView('table', this)">📋 列表视图</button>
        <button class="view-btn" data-view="calendar" onclick="setView('calendar', this)">📅 日历视图</button>
      </div>
    </div>

    <div class="filters">
      <div class="field">
        <label>城市 / 机场 / 航司</label>
        <input type="text" id="fKeyword" placeholder="如：吉隆坡、KUL、大阪、9C" oninput="onKeywordChange()" />
      </div>
      <div class="field">
        <label>最高预算 (¥)</label>
        <input type="number" id="fMaxPrice" placeholder="不限" oninput="render()" />
      </div>
      <div class="field">
        <label>行程类型</label>
        <select id="fTripType" onchange="render()">
          <option value="all">全部（单程 + 3-7天往返）</option>
          <option value="ow">仅看单程</option>
          <option value="rt">仅看 3-7 天往返</option>
        </select>
      </div>
      <div class="field">
        <label>往返停留天数</label>
        <select id="fStayDays" onchange="render()">
          <option value="all">不限（全部 / 3-7天）</option>
          <option value="3">往返 3 天</option>
          <option value="4">往返 4 天</option>
          <option value="5">往返 5 天</option>
          <option value="6">往返 6 天</option>
          <option value="7">往返 7 天</option>
        </select>
      </div>
      <div class="field">
        <label>经停筛选</label>
        <select id="fDirect" onchange="render()">
          <option value="all">全部航班</option>
          <option value="direct">仅看直飞</option>
        </select>
      </div>
      <div class="field">
        <label>出发最早日期</label>
        <input type="date" id="fDateStart" onchange="render()" />
      </div>
      <div class="field">
        <label>出发最晚日期</label>
        <input type="date" id="fDateEnd" onchange="render()" />
      </div>
      <div class="field">
        <label>排序方式</label>
        <select id="fSort" onchange="render()">
          <option value="price_asc">价格：从低到高</option>
          <option value="price_desc">价格：从高到低</option>
          <option value="date_asc">出发日期：由近到远</option>
          <option value="discount_desc">折扣力度：省钱最多</option>
          <option value="popular_asc">热门度优先</option>
        </select>
      </div>
      <label class="check-row">
        <input type="checkbox" id="fWeekend" onchange="render()" />
        仅看周五/周六出发
      </label>
    </div>

    <div class="toolbar">
      <span id="resultCount">共 0 条匹配结果</span>
      <span id="toolbarHint">💡 切换到「📅 日历视图」可按月历查看每日最低价</span>
    </div>

    <!-- 列表视图 -->
    <div class="table-wrap" id="tableView">
      <table>
        <thead>
          <tr>
            <th>航线方向</th>
            <th>类型 / 天数</th>
            <th>价格 &amp; 折扣基准</th>
            <th>出发 / 返程日期</th>
            <th>机场 &amp; 航司</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyTip" style="display:none;">没有符合当前筛选条件的机票，请放宽条件试试</div>
    </div>

    <!-- 日历视图 -->
    <div class="cal-box" id="calendarView" style="display:none;">
      <div class="cal-top">
        <div class="cal-city-pick">
          <strong>选择城市：</strong>
          <select id="calCitySelect" onchange="onCalCityChange()"></select>
        </div>
        <div style="font-size:12px;color:var(--muted);">🟢 低于中位价 &nbsp; 🔴 异常骨折价 &nbsp; 点击日期直接跳转购票</div>
      </div>
      <div class="month-pills" id="monthPills"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <script>
    let allDeals = [];
    let activeDir = "outbound";
    let activeTab = "all";
    let activeView = "table";
    let activeCalCity = "";
    let activeCalMonth = "";

    function esc(str) {
      return String(str || "").replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    function setDir(dir, btn) {
      activeDir = dir;
      document.querySelectorAll(".dir-bar .dir-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateStats();
      render();
    }

    function setTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll(".tabs .tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (tab === "radar") document.getElementById("fSort").value = "discount_desc";
      else if (tab === "popular") document.getElementById("fSort").value = "popular_asc";
      else document.getElementById("fSort").value = "price_asc";
      render();
    }

    function setView(view, btn) {
      activeView = view;
      document.querySelectorAll(".view-switch .view-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tableView").style.display = view === "table" ? "block" : "none";
      document.getElementById("calendarView").style.display = view === "calendar" ? "block" : "none";
      render();
    }

    function onKeywordChange() {
      const kw = document.getElementById("fKeyword").value.trim().toLowerCase();
      if (kw) {
        const match = allDeals.find(d => `${d.city_name} ${d.city}`.toLowerCase().includes(kw));
        if (match) activeCalCity = match.city;
      }
      render();
    }

    function onCalCityChange() {
      activeCalCity = document.getElementById("calCitySelect").value;
      activeCalMonth = "";
      renderCalendar(getFilteredDeals());
    }

    function resetFilters() {
      document.getElementById("fKeyword").value = "";
      document.getElementById("fMaxPrice").value = "";
      document.getElementById("fTripType").value = "all";
      document.getElementById("fStayDays").value = "all";
      document.getElementById("fDirect").value = "all";
      document.getElementById("fDateStart").value = "";
      document.getElementById("fDateEnd").value = "";
      document.getElementById("fWeekend").checked = false;
      render();
    }

    function getWeekdayLabel(dateStr) {
      const days = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      const d = new Date(dateStr + "T00:00:00");
      return isNaN(d) ? { label: "", day: -1 } : { label: days[d.getDay()], day: d.getDay() };
    }

    function updateStats() {
      const dirDeals = allDeals.filter(d => activeDir === "both" || d.direction === activeDir);
      const owPrices = dirDeals.filter(d => d.one_way).map(d => d.price);
      const rtPrices = dirDeals.filter(d => !d.one_way).map(d => d.price);
      document.getElementById("statTotal").textContent = dirDeals.length;
      document.getElementById("statAnomalies").textContent = dirDeals.filter(d => d.is_anomaly).length;
      document.getElementById("statMinOW").textContent = owPrices.length ? `¥${Math.min(...owPrices)}` : "-";
      document.getElementById("statMinRT").textContent = rtPrices.length ? `¥${Math.min(...rtPrices)}` : "-";
    }

    function getFilteredDeals() {
      const kw = document.getElementById("fKeyword").value.trim().toLowerCase();
      const maxP = Number(document.getElementById("fMaxPrice").value) || Infinity;
      const tripType = document.getElementById("fTripType").value;
      const stayDaysVal = document.getElementById("fStayDays").value;
      const directMode = document.getElementById("fDirect").value;
      const dStart = document.getElementById("fDateStart").value;
      const dEnd = document.getElementById("fDateEnd").value;
      const weekendOnly = document.getElementById("fWeekend").checked;

      return allDeals.filter(d => {
        if (activeDir !== "both" && d.direction !== activeDir) return false;
        if (activeTab === "radar" && !d.is_anomaly) return false;
        if (activeTab === "popular" && !d.is_popular) return false;
        if (kw) {
          const hay = `${d.origin_name} ${d.dest_name} ${d.origin} ${d.destination} ${d.origin_airport} ${d.dest_airport} ${d.airline}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        if (d.price > maxP) return false;
        if (tripType === "ow" && !d.one_way) return false;
        if (tripType === "rt" && d.one_way) return false;
        if (stayDaysVal !== "all") {
          if (d.one_way || String(d.stay_days) !== stayDaysVal) return false;
        }
        if (directMode === "direct" && d.transfers > 0) return false;
        if (dStart && d.dep_date < dStart) return false;
        if (dEnd && d.dep_date > dEnd) return false;
        if (weekendOnly) {
          const wd = getWeekdayLabel(d.dep_date).day;
          if (wd !== 5 && wd !== 6) return false;
        }
        return true;
      });
    }

    function render() {
      const list = getFilteredDeals();
      const sortBy = document.getElementById("fSort").value;
      list.sort((a, b) => {
        if (sortBy === "price_asc") return a.price - b.price;
        if (sortBy === "price_desc") return b.price - a.price;
        if (sortBy === "date_asc") return a.dep_date.localeCompare(b.dep_date);
        if (sortBy === "discount_desc") return (b.discount_pct - a.discount_pct) || (a.price - b.price);
        if (sortBy === "popular_asc") return (a.popular_rank - b.popular_rank) || (a.price - b.price);
        return 0;
      });

      document.getElementById("resultCount").textContent = `共 ${list.length} 条匹配结果`;
      if (activeView === "table") renderTable(list);
      else renderCalendar(list);
    }

    function renderTable(list) {
      const tbody = document.getElementById("tbody");
      const emptyTip = document.getElementById("emptyTip");
      if (list.length === 0) {
        tbody.innerHTML = "";
        emptyTip.style.display = "block";
        return;
      }
      emptyTip.style.display = "none";
      tbody.innerHTML = list.slice(0, 300).map(d => {
        const wd = getWeekdayLabel(d.dep_date).label;
        const dateHtml = d.one_way
          ? `${esc(d.dep_date)} <span style="color:var(--muted)">(${wd})</span>`
          : `${esc(d.dep_date)} (${wd})<br><span style="color:var(--muted);font-size:12px;">返: ${esc(d.ret_date)}</span>`;
        const dirBadge = d.direction === "outbound"
          ? `<span class="badge b-out">出发</span>`
          : `<span class="badge b-in">来沪</span>`;
        const badges = [
          d.is_anomaly ? `<span class="badge b-radar">${d.discount_pct > 0 ? d.discount_pct + "% OFF" : "促销"}</span>` : "",
          d.is_popular ? `<span class="badge b-pop">热门</span>` : "",
        ].join("");
        const typeHtml = d.one_way
          ? `<span class="badge b-ow">单程</span>`
          : `<span class="badge b-rt">往返 · ${d.stay_days}天</span>`;
        const baseHtml = d.baseline_price
          ? `<div style="font-size:12px;color:var(--muted)">中位均价 ¥${d.baseline_price}${d.save_amount > 0 ? ` · 省¥${d.save_amount}` : ""}</div>`
          : "";
        const stopTxt = d.transfers === 0 ? "直飞" : `${d.transfers}经停`;
        return `
          <tr>
            <td>${dirBadge}<strong>${esc(d.origin_name)} → ${esc(d.dest_name)}</strong>${badges}</td>
            <td>${typeHtml}</td>
            <td><span class="price">¥${d.price}</span>${baseHtml}</td>
            <td>${dateHtml}</td>
            <td>${esc(d.origin_airport)} → ${esc(d.dest_airport)}<br><span style="font-size:12px;color:var(--muted)">${esc(d.airline)} · ${stopTxt}</span></td>
            <td><a class="btn-link" href="${esc(d.link)}" target="_blank" rel="noopener">查看购票</a></td>
          </tr>
        `;
      }).join("");
    }

    function renderCalendar(list) {
      // 统计当前筛选下的各城市报价数，供下拉框选择
      const cityMap = {};
      list.forEach(d => {
        if (!cityMap[d.city]) cityMap[d.city] = { code: d.city, name: d.city_name, count: 0, minP: d.price };
        cityMap[d.city].count++;
        if (d.price < cityMap[d.city].minP) cityMap[d.city].minP = d.price;
      });
      const cityOptions = Object.values(cityMap).sort((a, b) => b.count - a.count);
      const sel = document.getElementById("calCitySelect");
      const pillsEl = document.getElementById("monthPills");
      const gridEl = document.getElementById("calGrid");

      if (cityOptions.length === 0) {
        sel.innerHTML = `<option>无匹配城市</option>`;
        pillsEl.innerHTML = "";
        gridEl.innerHTML = `<div class="empty" style="grid-column:1/-1;">没有符合条件的城市数据，请调整上方筛选条件</div>`;
        return;
      }

      if (!activeCalCity || !cityMap[activeCalCity]) {
        activeCalCity = cityOptions[0].code;
      }
      sel.innerHTML = cityOptions.map(c =>
        `<option value="${esc(c.code)}" ${c.code === activeCalCity ? "selected" : ""}>${esc(c.name)} (${esc(c.code)}) · ${c.count}条 · 最低¥${c.minP}</option>`
      ).join("");

      const cityDeals = list.filter(d => d.city === activeCalCity);
      // 按月份聚合最低价，同时每天只保留最便宜的一条
      const monthMin = {};
      const dayBest = {};
      cityDeals.forEach(d => {
        const m = d.dep_date.slice(0, 7);
        if (!monthMin[m] || d.price < monthMin[m]) monthMin[m] = d.price;
        if (!dayBest[d.dep_date] || d.price < dayBest[d.dep_date].price) dayBest[d.dep_date] = d;
      });

      const months = Object.keys(monthMin).sort();
      if (!activeCalMonth || !monthMin[activeCalMonth]) {
        activeCalMonth = months[0];
      }

      pillsEl.innerHTML = months.map(m =>
        `<button class="m-pill ${m === activeCalMonth ? "active" : ""}" onclick="activeCalMonth='${m}';renderCalendar(getFilteredDeals());">${m}<small>¥${monthMin[m]}</small></button>`
      ).join("");

      // 渲染该月的周一~周日网格
      const [yStr, mStr] = activeCalMonth.split("-");
      const year = Number(yStr), month = Number(mStr);
      const firstDay = new Date(year, month - 1, 1).getDay();
      const offset = (firstDay + 6) % 7; // 周一为第0列
      const daysInMonth = new Date(year, month, 0).getDate();

      const heads = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"]
        .map(h => `<div class="cal-head">${h}</div>`).join("");

      let cells = "";
      for (let i = 0; i < offset; i++) {
        cells += `<div class="cal-cell empty-cell"></div>`;
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${yStr}-${mStr}-${String(day).padStart(2, "0")}`;
        const wd = getWeekdayLabel(dStr).day;
        const isWknd = (wd === 5 || wd === 6);
        const deal = dayBest[dStr];

        if (!deal) {
          cells += `
            <div class="cal-cell">
              <div class="cal-day"><span>${day}</span>${isWknd ? '<span class="wknd">休</span>' : ''}</div>
              <div style="color:#cbd5e1;font-size:12px;">-</div>
            </div>`;
        } else {
          const cls = deal.is_anomaly ? "is-anomaly" : (deal.baseline_price && deal.price < deal.baseline_price ? "is-cheap" : "");
          const dirTag = activeDir === "both" ? (deal.direction === "outbound" ? "去 " : "回 ") : "";
          const tripTag = deal.one_way ? (deal.transfers === 0 ? "直飞" : `${deal.transfers}转`) : `往返${deal.stay_days}天`;
          cells += `
            <a class="cal-cell has-deal ${cls}" href="${esc(deal.link)}" target="_blank" rel="noopener">
              <div class="cal-day"><span>${day}</span>${isWknd ? '<span class="wknd">五六</span>' : ''}</div>
              <div class="cal-price">${dirTag}¥${deal.price}</div>
              <div class="cal-sub">${esc(deal.airline)} · ${tripTag}</div>
            </a>`;
        }
      }
      gridEl.innerHTML = heads + cells;
    }

    fetch("./data.json?t=" + Date.now())
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => {
        document.getElementById("updatedAt").textContent = `最近更新：${data.updated_at || "-"}（往返已过滤为 3-7 天）`;
        allDeals = data.deals || [];
        updateStats();
        render();
      })
      .catch(err => {
        document.getElementById("updatedAt").textContent = "加载数据失败，请确保通过 Vercel 访问且已运行 radar.yml (" + err.message + ")";
      });
  </script>
</body>
</html>
